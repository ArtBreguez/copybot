name: Verify source package
on:
  push:
  pull_request:
  workflow_run:
    workflows:
      - Copilot cloud agent
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install test and documentation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Release privacy checks
        run: python scripts/check_release.py
      - name: Rust regression tests
        run: cargo test --locked --manifest-path hot/Cargo.toml --lib --bin copybot-hot
      - name: Observer and packaging tests
        run: python -m pytest deploy/ scripts/test_check_release.py -q -p no:cacheprovider
      - name: Generated guides are current
        run: python scripts/build_docs.py --check

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - if: github.event_name == 'workflow_run'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: github.event_name != 'workflow_run'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  sast:
    name: SAST (CodeQL)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          languages: ${{ matrix.language }}
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build Rust target for CodeQL
        if: matrix.language == 'rust'
        run: cargo build --locked --manifest-path hot/Cargo.toml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2031cfc080254a8a887f58cffee85186f0e49e48

  sca:
    name: SCA (Dependency Review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        with:
          fail-on-severity: high
